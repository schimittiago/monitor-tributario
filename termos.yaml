# =============================================================
# Termos e órgãos que o leitor do DOU usa para filtrar os atos.
# Edite à vontade: cada linha começa com "- " e o texto entre aspas.
# Maiúsculas/minúsculas, acentos e "nº"/"n°" NÃO importam (exceto em "siglas").
# O termo casa com palavra inteira. Termine com * para casar o começo da
# palavra (ex.: "tributari*" casa tributário, tributária, tributários...).
# =============================================================

# Seções do DOU a baixar. DO1 = atos normativos; DO1E = edições extras da Seção 1.
# (DO2 = pessoal, DO3 = contratos/editais — normalmente não interessam)
secoes:
  - DO1
  - DO1E

# --- Nível ALTO: Reforma Tributária do consumo ---
reforma:
  - "reforma tributária"
  - "contribuição sobre bens e serviços"
  - "imposto sobre bens e serviços"
  - "imposto seletivo"
  - "comitê gestor do imposto sobre bens e serviços"
  - "comitê gestor do ibs"
  - "lei complementar nº 214"
  - "lc 214"
  - "lei complementar nº 227"
  - "lc 227"
  - "emenda constitucional nº 132"
  - "ec 132"
  - "split payment"
  - "pagamento cindido"
  - "declaração de regimes específicos"
  - "devolução personalizada"
  - "cashback"
  - "zona franca de manaus"

# Siglas: comparadas como palavra inteira e em MAIÚSCULAS (evita falso positivo)
siglas_reforma:
  - "CBS"
  - "IBS"
  - "CGIBS"
  - "DeRE"

