  - "pis/pasep"
  - "cofins"
  - "irpj"
  - "csll"
  - "ipi"
  - "iof"
  - "imposto sobre a renda"
  - "imposto sobre produtos industrializados"
  - "simples nacional"
  - "tributari*"          # tributário, tributária, tributários...
  - "contribuição previdenciária"
  - "convênio icms"
  - "ajuste sinief"
  - "ato cotepe"
  - "solução de consulta"
  - "ato declaratório interpretativo"
  - "nota técnica"
  - "documento fiscal"
  - "nota fiscal"
  - "nf-e"
  - "nfs-e"
  - "efd"
  - "sped"
  - "dctf"
  - "transação tributária"
  - "parcelamento"
  - "benefício fiscal"
  - "incentivo fiscal"
  - "drawback"
  - "obrigação acessória"

# Órgãos (campo "órgão" do ato). Ato desses órgãos entra mesmo sem termo,
# desde que não seja ato de pessoal / rotina (ver "ruido").
orgaos:
  - "secretaria especial da receita federal"
  - "procuradoria-geral da fazenda nacional"
  - "conselho nacional de política fazendária"
  - "comitê gestor do imposto sobre bens e serviços"
  - "comitê gestor do simples nacional"
  - "conselho administrativo de recursos fiscais"
  - "ministério da fazenda/gabinete do ministro"
  - "secretaria extraordinária da reforma tributária"

# Tipos de ato considerados normativos (sobem para nível médio)
tipos_normativos:
  - "lei"
  - "lei complementar"
  - "medida provisória"
  - "decreto"
  - "instrução normativa"
  - "ato conjunto"
  - "ato declaratório interpretativo"
  - "solução de consulta"
  - "solução de divergência"
  - "resolução"
  - "convênio"
  - "ajuste"
  - "portaria normativa"
  - "portaria conjunta"
  - "nota técnica"
  - "parecer normativo"

# Ruído: se o ato só entrou pelo órgão (sem termo tributário),
# e contém uma destas expressões, é descartado.
ruido:
  - "nomear"
  - "exonerar"
  - "dispensar"
  - "designar"
  - "aposentad*"
  - "aposentar"
  - "pensão"
  - "remoção"
  - "lotação"
  - "cessão"
